<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Viso 90 · Routine facciale</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viso 90">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0B1220;--s1:#121C31;--s2:#1A2740;--s3:#243659;--tx:#EAF0FF;--mu:#8FA3C8;--ac:#3DD6B5;--ac2:#FFB454;--bad:#FF6B7A;--ok:#38D68B;--r:18px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,p{margin:0}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(88px + var(--sb))}
.screen{display:none;padding:calc(18px + var(--st)) 16px 8px}
.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--s1);border:1px solid #ffffff12;border-radius:var(--r);padding:14px}
.muted{color:var(--mu)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:600;color:var(--mu)}
.chip.ac{background:#3DD6B522;color:var(--ac)}
.chip.am{background:#FFB45422;color:var(--ac2)}
h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
h2{font-size:20px;font-weight:750}
h3{font-size:16px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;background:linear-gradient(135deg,#3DD6B5,#2BB6D9);color:#06231D;font-weight:800;font-size:17px;box-shadow:0 8px 24px #3DD6B533}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:none;font-weight:700}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.am{background:linear-gradient(135deg,#FFB454,#FF8F4D);color:#2A1500;box-shadow:0 8px 24px #FFB45433}

/* nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:flex;padding:8px 8px calc(8px + var(--sb));background:#0B1220E6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #ffffff12;z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mu);font-size:11px;font-weight:700;border-radius:12px}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--ac)}

/* today */
.hero{display:flex;align-items:center;gap:16px;padding:16px;background:linear-gradient(160deg,#16294A,#0F1B33);border:1px solid #ffffff14;border-radius:24px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .bg{stroke:#ffffff14}
.ring .fg{stroke:url(#rg);transition:stroke-dashoffset .8s ease}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .in b{font-size:30px;font-weight:850}
.ring .in span{font-size:11px;color:var(--mu);margin-top:3px;font-weight:700;letter-spacing:.4px}
.week{display:flex;gap:6px;margin:14px 0 4px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--mu);font-weight:700}
.dot{display:block;width:100%;aspect-ratio:1;max-width:38px;margin:5px auto 0;border-radius:50%;background:var(--s2);border:2px solid transparent;position:relative}
.dot.done{background:var(--ac);border-color:var(--ac)}
.dot.rest{background:var(--ac2);border-color:var(--ac2)}
.dot.partial{background:linear-gradient(90deg,var(--ac) 50%,var(--s2) 50%)}
.dot.missed{background:transparent;border-color:#FF6B7A66}
.dot.today{border-color:#fff}
.dot.done::after,.dot.rest::after{content:"";position:absolute;left:32%;top:20%;width:30%;height:48%;border:solid #06231D;border-width:0 3px 3px 0;transform:rotate(40deg)}
.dot.rest::after{display:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.ex{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:10px;background:var(--s1);border:1px solid #ffffff12;border-radius:18px}
.ex.done{opacity:.7}
.thumb{width:92px;height:70px;flex:none;border-radius:12px;overflow:hidden;background:#0E1730;pointer-events:none}
.thumb .sv,.thumb svg{width:100%;height:100%;display:block}
.ex .meta{flex:1;min-width:0;text-align:left}
.ex .meta b{display:block;font-size:16px}
.ex .meta span{font-size:13px;color:var(--mu)}
.chk{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid #ffffff33;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ac);border-color:var(--ac)}
.chk svg{width:18px;height:18px;stroke:#06231D;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on svg{opacity:1}
.tip{display:flex;gap:10px;padding:12px 14px;background:#FFB4541A;border:1px solid #FFB45433;border-radius:14px;color:#FFD9A3;font-size:14px}
.note{padding:12px 14px;background:var(--s2);border-radius:14px;font-size:14px;color:#C5D2EE}

/* plan */
.phases{display:flex;gap:8px;overflow:auto;margin:12px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.phases::-webkit-scrollbar{display:none}
.phase{flex:none;width:210px;padding:12px;border-radius:16px;background:var(--s1);border:1px solid #ffffff12;font-size:13px;color:var(--mu)}
.phase b{display:block;color:var(--tx);font-size:14px;margin-bottom:3px}
.phase.cur{border-color:var(--ac);background:#3DD6B510}
.grid{display:grid;grid-template-columns:34px repeat(7,1fr);gap:6px;margin-top:10px;align-items:center}
.grid .h{font-size:11px;color:var(--mu);font-weight:800;text-align:center}
.grid .wk{font-size:10px;color:var(--mu);font-weight:700}
.cell{aspect-ratio:1;border-radius:11px;background:var(--s1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:750;color:#7C90B6;border:2px solid transparent;position:relative}
.cell.e{background:none;pointer-events:none}
.cell.done{background:var(--ac);color:#06231D}
.cell.rest{background:var(--ac2);color:#2A1500}
.cell.partial{background:linear-gradient(135deg,#3DD6B5 50%,var(--s1) 50%);color:#fff}
.cell.missed{border-color:#FF6B7A66;color:#FF9AA5}
.cell.today{border-color:#fff;box-shadow:0 0 0 3px #ffffff22}
.cell.future{opacity:.55}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--mu)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:18px;background:var(--s1);border:1px solid #ffffff12}
.stat b{display:block;font-size:28px;font-weight:850;line-height:1.1}
.stat span{font-size:12px;color:var(--mu);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:10px}
.bars div{flex:1;border-radius:6px 6px 3px 3px;background:var(--s3);min-height:4px}
.bars div.d{background:var(--ac)}.bars div.r{background:var(--ac2)}.bars div.p{background:#3DD6B588}
.exstat{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #ffffff10}
.exstat:first-child{border-top:0}
.exstat .nums{display:flex;gap:14px;font-size:12px;color:var(--mu)}
.exstat .nums b{display:block;color:var(--tx);font-size:16px}
textarea,input[type=date]{width:100%;background:var(--s2);color:var(--tx);border:1px solid #ffffff1f;border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
input[type=date]{font:16px system-ui;color-scheme:dark}
textarea{min-height:84px;resize:vertical}
.tog{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--s3);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:23px}

/* guide */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{padding:8px 4px;text-align:center;border-bottom:1px solid #ffffff10}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700;font-size:13px;padding-left:2px}
.tbl th{color:var(--mu);font-weight:700}
.tbl .y{color:var(--ac);font-weight:900}
.gex{padding:14px;margin-bottom:14px;background:var(--s1);border:1px solid #ffffff12;border-radius:22px}
.gex .stage{margin:10px 0 12px}
.gex ol{margin:8px 0 0;padding-left:20px}
.gex li{margin:6px 0;color:#D5DEF3;font-size:15px}
.warn{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FF6B7A18;border:1px solid #FF6B7A44;color:#FFC2C9;font-size:13px}
.assume{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFB45414;border:1px solid #FFB45433;color:#FFD9A3;font-size:13px}

/* stage (animazioni) */
.stage{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#14223F,#0C1528);border:1px solid #ffffff12}
.stage .sv{width:100%;height:100%}
.stage .sv svg{width:100%;height:100%;display:block}
.stage.g{height:240px}
.phasechip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:#0B1220CC;border:1px solid #3DD6B544;font-weight:800;font-size:14px;color:var(--ac);white-space:nowrap;backdrop-filter:blur(6px)}
.legendm{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#FFC2CB;background:#0B1220B3;padding:5px 9px;border-radius:999px}
.legendm i{width:9px;height:9px;border-radius:50%;background:#FF4D6A;box-shadow:0 0 8px #FF4D6A}
.cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:#fff;background:#0B1220B8;z-index:3}
.cd.on{display:flex}

/* player */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:0 auto}
#player.on{display:flex;animation:fade .2s ease}
.p-top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 14px 8px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.segs{flex:1;display:flex;gap:5px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--s3)}
.segs i.d{background:var(--ac)}.segs i.c{background:#fff}
.p-stage{padding:0 14px}
.p-stage .stage{height:min(38dvh,340px)}
.p-body{flex:1;overflow:auto;padding:12px 16px 8px}
.p-body h2{font-size:22px}
.rc{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.rc .num{font-size:60px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--ac)}
.rc .of{color:var(--mu);font-size:14px;font-weight:650}
.zone{margin-left:auto;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--s2);color:var(--mu);font-weight:800;text-align:center}
.zone.on{background:#FFB45426;color:var(--ac2)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--s3);margin:12px 0 4px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#3DD6B5,#2BB6D9);width:0;transition:width .15s}
.bar .z{position:absolute;top:-3px;bottom:-3px;border-radius:4px;background:#FFB45433;border:1px solid #FFB45477}
.ctl{display:flex;align-items:center;gap:12px;margin-top:14px}
.rb{width:62px;height:62px;border-radius:18px;background:var(--s2);font-size:22px;font-weight:800;flex:none}
.play{flex:1;height:62px;border-radius:18px;background:linear-gradient(135deg,#3DD6B5,#2BB6D9);color:#06231D;font-weight:850;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.play.pause{background:var(--s3);color:var(--tx)}
.spd{display:flex;gap:6px;margin-top:12px;align-items:center;font-size:13px;color:var(--mu);font-weight:700}
.spd button{padding:6px 11px;border-radius:999px;background:var(--s2);font-weight:800;font-size:13px;color:var(--mu)}
.spd button.on{background:#3DD6B522;color:var(--ac)}
.p-steps{margin-top:16px}
.p-steps ol{padding-left:20px;margin:8px 0 0}
.p-steps li{margin:6px 0;color:#D5DEF3;font-size:15px}
.p-cta{padding:10px 14px calc(12px + var(--sb));display:flex;gap:10px;border-top:1px solid #ffffff10;background:#0B1220}
.p-cta .btn.ghost{width:auto;flex:none;padding:15px 18px}
.sw-big{font-size:58px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.holds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.holds span{padding:5px 10px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:700;color:#C5D2EE}
.sum{text-align:center;padding:20px 16px}
.sum .big{font-size:56px}
.sum ul{list-style:none;padding:0;margin:16px 0;text-align:left}
.sum li{display:flex;justify-content:space-between;padding:12px 14px;background:var(--s1);border-radius:14px;margin-bottom:8px}
.sum li b{color:var(--ac)}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:90;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

/* sheet / toast / welcome */
#sheet{position:fixed;inset:0;z-index:80;background:#000A;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{width:100%;max-width:520px;max-height:86dvh;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;padding:18px 16px calc(20px + var(--sb));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translate(-50%,20px);background:#EAF0FF;color:#0B1220;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#welcome{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;overflow:auto}
#welcome.on{display:block}
#welcome .w{max-width:520px;margin:0 auto;padding:calc(22px + var(--st)) 18px 30px}
#welcome .stage{height:260px;margin:14px 0}
.hidden{display:none!important}
@media (min-width:700px){#app{border-left:1px solid #ffffff0d;border-right:1px solid #ffffff0d}}

</style>
</head>
<body>
<div id="app">
  <section id="s-today" class="screen on"></section>
  <section id="s-plan" class="screen"></section>
  <section id="s-stats" class="screen"></section>
  <section id="s-guide" class="screen"></section>
  <nav id="nav"></nav>
</div>
<div id="player"></div>
<div id="sheet"></div>
<div id="welcome"></div>
<div id="toast" role="status"></div>
<script>
/* Animazioni illustrate degli esercizi (SVG + JS, nessuna dipendenza) */
(function (global) {
  'use strict';

  var C = {
    skin: '#F2C8A6', skinD: '#DDA67F', skinDD: '#C48A64', skinL: '#F9DEC8',
    hair: '#2B211E', hairL: '#4B3A33', lip: '#D68C82', lipD: '#B4655D',
    shirt: '#2F72AE', shirtD: '#245884', shirtL: '#4C90CC',
    teeth: '#F8F6F0', gum: '#86E6C4', gumD: '#4FBB9A', mus: '#FF4D6A',
    white: '#F5F2ED', iris: '#6A4A33', mouth: '#4B1E2A'
  };

  var clamp = function (x, a, b) { a = a === undefined ? 0 : a; b = b === undefined ? 1 : b; return Math.min(b, Math.max(a, x)); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var eIO = function (t) { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  var eO = function (t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
  var eI = function (t) { t = clamp(t); return t * t * t; };
  var seg = function (p, a, b) { return clamp((p - a) / (b - a)); };
  var f1 = function (n) { return (Math.round(n * 10) / 10); };
  var pt = function (a) { return f1(a[0]) + ' ' + f1(a[1]); };
  var rotPt = function (a, o, deg) {
    var r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r), x = a[0] - o[0], y = a[1] - o[1];
    return [o[0] + x * c - y * s, o[1] + x * s + y * c];
  };

  /* ------------------------------------------------------------------ */
  /*  Testa di profilo (guarda a destra) con mascella articolata         */
  /* ------------------------------------------------------------------ */
  function profileHead(u) {
    return '' +
    '<g id="head' + u + '">' +
      // interno bocca + gomma + denti (dietro la pelle: si vedono solo quando la bocca si apre)
      '<g id="mouthin' + u + '">' +
        '<path d="M 212 210 L 272 210 L 272 236 L 212 236 Z" fill="' + C.mouth + '"/>' +
        '<rect id="gum' + u + '" x="234" y="207" width="32" height="22" rx="9" fill="' + C.gum + '" stroke="' + C.gumD + '" stroke-width="2"/>' +
        '<rect x="256" y="198" width="12" height="21" rx="4" fill="' + C.teeth + '"/>' +
        '<rect x="243" y="200" width="12" height="18" rx="4" fill="#EEEAE2"/>' +
      '</g>' +
      '<g id="jawback' + u + '">' +
        '<rect x="256" y="206" width="12" height="20" rx="4" fill="' + C.teeth + '"/>' +
        '<rect x="243" y="207" width="12" height="19" rx="4" fill="#EEEAE2"/>' +
      '</g>' +
      // cranio + viso
      '<path id="skull' + u + '" fill="' + C.skin + '" d="M 146 214 C 120 198 108 172 111 142 C 115 92 154 48 207 48 C 249 48 272 76 273 108 C 274 120 276 130 277 137 C 272 141 263 143 265 151 C 270 162 289 176 296 184 C 299 190 293 195 283 194 C 277 194 272 195 272 200 C 273 204 277 208 275 212 L 262 213 L 200 214 C 176 216 158 217 146 214 Z"/>' +
      '<ellipse cx="236" cy="186" rx="17" ry="12" fill="#E8837A" opacity=".16"/>' +
      '<path d="M 270 178 Q 279 190 283 193" stroke="' + C.skinDD + '" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>' +
      '<ellipse cx="284" cy="188.5" rx="3.2" ry="1.8" fill="#8C5A44" transform="rotate(-18 284 188.5)"/>' +
      '<path d="M 272 200 C 273 204 277 208 275 212 L 262 213 L 256 207 C 261 203 267 201 272 200 Z" fill="' + C.lip + '"/>' +
      // mascella (parte mobile)
      '<g id="jaw' + u + '">' +
        '<path fill="' + C.skin + '" d="M 262 213 C 266 214 273 216 272 221 C 270 225 262 226 262 231 C 266 237 275 243 271 251 C 267 259 252 259 242 256 C 222 252 192 248 170 239 C 159 234 154 224 154 210 L 152 190 C 152 178 160 170 172 168 C 200 172 232 196 262 213 Z"/>' +
        '<path d="M 172 239 C 195 249 225 254 246 257" stroke="' + C.skinD + '" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>' +
        '<path d="M 262 213 C 266 214 273 216 272 221 C 270 225 262 226 262 231 L 255 229 L 254 216 Z" fill="' + C.lip + '"/>' +
        '<path d="M 263 232 Q 268 236 267 240" stroke="' + C.skinDD + '" stroke-width="2" fill="none" opacity=".45" stroke-linecap="round"/>' +
      '</g>' +
      '<path d="M 276 212 L 246 213.5" stroke="' + C.lipD + '" stroke-width="1.8" stroke-linecap="round" fill="none"/>' +
      // massetere

        var idx = Math.floor(P.acc / cyc);
        while (P.cycleIdx < idx) { P.cycleIdx++; incRep(1); }
        var tm = $('#ptime'); if (tm) tm.textContent = mmss(P.elapsed / 1000);
      }
      P.p = (P.acc % cyc) / cyc;
    }
    P.anim.update(P.p);
    var lab = P.anim.phase(P.p), pe = $('#pphase');
    if (pe && P.label !== lab && (P.playing || P.cd)) { P.label = lab; pe.textContent = lab; }
    if (e.mode === 'time' && P.holdRun) { var sw = $('#psw'); if (sw) sw.textContent = mmss((t - P.holdStart) / 1000); }
  }
  function setPlay() {
    var b = $('#pplay'), P = Player; if (!b || P.e.mode !== 'reps') return;
    if (P.playing || P.cd) { b.innerHTML = '❚❚ Pausa'; b.classList.add('pause'); } else { b.innerHTML = P.reps ? '▶ Riprendi' : '▶ Avvia'; b.classList.remove('pause'); }
    if (!P.playing && !P.cd) { var pe = $('#pphase'); if (pe) pe.textContent = 'In pausa'; P.label = null; }
  }
  function finishEx(skip) {
    var P = Player, e = P.e, ds = ymd(today());
    if (!skip) {
      var L = rec(ds); delete L.rest;
      if (e.mode === 'reps') { L.done[e.id] = { reps: P.reps, t: Date.now() }; P.results.push({ e: e, reps: P.reps }); }
      else { var tot = P.holds.reduce(function (a, b) { return a + b; }, 0); L.done[e.id] = { secs: tot, holds: P.holds.slice(), t: Date.now() }; P.results.push({ e: e, secs: tot }); }
      save(); beep(880, 0.12);
    }
    P.playing = false;
    if (P.i + 1 < P.queue.length) { P.i++; loadExercise(); } else summary();
  }
  function summary() {
    var P = Player, h = '<div class="p-top"><span class="sp"></span><button class="ib" data-a="pclose">' + ICON.x + '</button></div><div class="p-body"><div class="sum">';
    P.playing = false; P.anim = null;
    if (P.results.length) {
      h += '<div class="big">🎉</div><h1 style="margin-top:8px">' + (P.single ? 'Esercizio registrato' : 'Allenamento completato') + '</h1><ul>' + P.results.map(function (r) {
        return '<li><span>' + r.e.name + '</span><b>' + (r.e.mode === 'reps' ? r.reps + ' rip' : mmss(r.secs)) + '</b></li>';
      }).join('') + '</ul>';
      var ds = ymd(today()), sc = sched(today());
      if (sc.every(function (id) { return isDone(ds, id); })) { h += '<p class="muted">Giornata completata · serie di <b style="color:var(--ac2)">' + streak() + '</b> ' + (streak() === 1 ? 'giorno' : 'giorni') + ' 🔥</p>'; confetti(); }
      else h += '<p class="muted">Ti mancano ancora degli esercizi per chiudere la giornata.</p>';
    } else { h += '<h1>Sessione chiusa</h1><p class="muted" style="margin-top:8px">Nessun esercizio registrato.</p>'; }
    h += '</div></div><div class="p-cta"><button class="btn" data-a="pclose">Chiudi</button></div>';
    $('#player').innerHTML = h;
  }
  function closePlayer() {
    Player.on = false; Player.anim = null; unlockScreen();
    $('#player').classList.remove('on'); $('#player').innerHTML = '';
    render();
  }
  function confetti() {
    var cols = ['#3DD6B5', '#FFB454', '#2BB6D9', '#FF6B7A', '#EAF0FF'];
    for (var i = 0; i < 46; i++) {
      var c = document.createElement('i'); c.className = 'conf';
      c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
      c.style.animationDelay = (Math.random() * 0.6) + 's'; c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      document.body.appendChild(c); (function (x) { setTimeout(function () { x.remove(); }, 4200); })(c);
    }
  }
  document.addEventListener('visibilitychange', function () {
    var P = Player; if (document.hidden && P.on && P.playing && P.e && P.e.mode === 'reps') { P.playing = false; setPlay(); }
  });

  /* ---------------------------------------------------------------- eventi */
  var A = {
    begin: function () {
      var v = $('#wstart').value || ymd(today()); S.start = v; save(); $('#welcome').classList.remove('on'); $('#welcome').innerHTML = ''; go('today');
    },
    session: function () { var ds = ymd(today()); startSession(sched(today()).filter(function (id) { return !isDone(ds, id); })); },
    openex: function (el) { startSession([el.dataset.id], true); },
    toggle: function (el, ev) {
      ev.stopPropagation(); toggleDone(el.dataset.d, el.dataset.id);
      if (el.dataset.sheet) openDay(el.dataset.d);
      render(); afterDayChange(el.dataset.d);
    },
    rest: function (el) {
      var L = rec(el.dataset.d); L.rest = !L.rest; save();
      if (el.dataset.sheet) closeSheet();
      render(); if (L.rest) toast('Riposo registrato. La serie continua 💤');
    },
    day: function (el) { openDay(el.dataset.d); },
    closesheet: closeSheet,
    pclose: function () { if (Player.on && Player.results && Player.results.length === 0 && Player.anim && !Player.confirm && (Player.reps > 0)) { Player.confirm = true; toast('Tocca ancora per uscire senza salvare'); setTimeout(function () { Player.confirm = false; }, 2500); return; } closePlayer(); },
    pplay: function () {
      var P = Player;
      if (P.playing || P.cd) { P.playing = false; P.cd = false; $('#pcd').classList.remove('on'); setPlay(); return; }
      if (P.reps === 0 && P.acc === 0) { P.cd = true; P.cdEnd = performance.now() + 3000; P.cdShown = 0; $('#pcd').classList.add('on'); beep(600, 0.05); setPlay(); }
      else { P.playing = true; P.last = performance.now(); setPlay(); }
    },
    inc: function () { incRep(1); }, dec: function () { incRep(-1); },
    spd: function (el) { Player.speed = parseFloat(el.dataset.v); setSpd(); },
    hold: function () {
      var P = Player, b = $('#pplay');
      if (!P.holdRun) { P.holdRun = true; P.holdStart = performance.now(); b.innerHTML = '■ Stop'; b.classList.add('pause'); beep(900, 0.1); }
      else {
        P.holdRun = false; var s = Math.round((performance.now() - P.holdStart) / 1000);
        b.innerHTML = '▶ Avvia tenuta'; b.classList.remove('pause'); $('#psw').textContent = '00:00';
        if (s >= 1) { P.holds.push(s); toast('Tenuta di ' + mmss(s) + ' salvata'); beep(660, 0.12); }
        renderHolds();
      }
    },
    pfinish: function () { var P = Player; if (P.holdRun) { A.hold(); } finishEx(false); },
    pskip: function () { finishEx(true); },
    tgl: function (el) { var k = el.dataset.k; S.set[k] = !S.set[k]; save(); rStats(); },
    bkcopy: function () {
      var ta = $('#bk'); ta.value = JSON.stringify(S); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      try { if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { toast('Backup copiato'); }, function () { toast(ok ? 'Backup copiato' : 'Selezionato: copialo a mano'); }); else toast(ok ? 'Backup copiato' : 'Selezionato: copialo a mano'); } catch (e) { toast(ok ? 'Backup copiato' : 'Selezionato: copialo a mano'); }
    },
    bkimport: function () {
      try {
        var o = JSON.parse($('#bk').value);
        if (!o || typeof o !== 'object' || !o.log || !o.start) throw 1;
        S = o; if (!S.set) S.set = { sound: true, vib: true }; save(); toast('Backup ripristinato'); render();
      } catch (e) { toast('Backup non valido'); }
    },
    reset: function () {
      sheet('<h2>Azzerare tutto?</h2><p class="muted" style="margin:8px 0 14px">Cancella progressi e data d\'inizio da questo dispositivo. Non si può annullare.</p><button class="btn am" data-a="reset2">Sì, azzera</button><button class="btn ghost" data-a="closesheet" style="margin-top:10px">Annulla</button>');
    },
    reset2: function () { S = { v: 1, start: null, log: {}, set: { sound: true, vib: true } }; save(); closeSheet(); render(); },
    install: function () {
      if (!deferredInstall) return; deferredInstall.prompt();
      deferredInstall.userChoice.then(function () { deferredInstall = null; render(); }, function () {});
    }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (el && A[el.dataset.a]) { A[el.dataset.a](el, e); return; }
    var nb = e.target.closest('#nav button'); if (nb) go(nb.dataset.tab);
    if (e.target.id === 'sheet') closeSheet();
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'startIn' && e.target.value) { S.start = e.target.value; save(); toast('Data d\'inizio aggiornata'); render(); }
  });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; render(); });
  window.addEventListener('appinstalled', function () { deferredInstall = null; toast('App installata'); render(); });

  /* ---------------------------------------------------------------- avvio */
  $('#nav').innerHTML = [['today', 'Oggi'], ['plan', 'Piano'], ['stats', 'Progressi'], ['guide', 'Guida']].map(function (t) { return '<button data-tab="' + t[0] + '">' + ICON[t[0]] + '<span>' + t[1] + '</span></button>'; }).join('');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  go('today');
  window.__viso90 = { S: function () { return S; }, go: go, startSession: startSession, Player: function () { return Player; } };
})();

</script>
</body>
</html>
